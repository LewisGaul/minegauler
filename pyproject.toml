# Packaging configuration
# ========================

[project]
name = "minegauler"
version = "4.2.0"
description = "A clone of the original minesweeper game with many added features"
readme = "README.pypi.md"
authors = [{name = "Lewis Gaul", email = "minegauler@gmail.com"}]
urls."Bug Reports" = "https://github.com/LewisGaul/minegauler/issues"
urls.Source = "https://github.com/LewisGaul/minegauler/"
urls.Background = "https://www.lewisgaul.co.uk/blog/coding/2020/02/12/minegauler/"
keywords = ["minesweeper", "game", "puzzle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Topic :: Games/Entertainment :: Puzzle Games"
]
requires-python = ">=3.11"
dependencies = [
    "attrs",
    "PyQt6",
    "requests",
    "pytz",
    "tabulate",
    "typing-extensions",
    "zig-minesolver >= 0.1.1, < 0.2",
]
gui-scripts.minegauler = "minegauler.app.__main__:main"
scripts.minegauler-bot = "minegauler.bot.__main__:main"

[dependency-groups]
dev = [
    "black",
    "coverage",
    "import-linter",
    "mypy",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-qt",
    "ruff",
    "bump2version",
    "pyinstaller",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["minegauler*"]

[tool.setuptools.package-data]
"minegauler.app" = [
    "boards/sample.mgb",
    "files/*.txt",
    "images/icon.ico",
    "images/faces/*",
    "images/buttons/*/*",
    "images/markers/*/*",
    "images/numbers/*/*"
]


# Tooling configuration
# ========================

# black
# ------------------------
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.spec$|\.pyi?$'
extend_exclude = '.*venv.*|_vendor|__pycache__'

# ruff
# ------------------------
[tool.ruff.lint]
preview = true
select = [
    # pydocstyle
    "D",
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-2020
    "YTT",
    # flake8-async
    "ASYNC",
    # flake8-bandit
    "unsafe-yaml-load",
    # flake8-bugbear
    "B",
    # flake8-executable
    "EXE",
    # flake8-pie
    "PIE",
    # flake8-pytest-style
    "PT",
    # flake8-pyi
    "PYI",
    # flake8-simplify
    "SIM",
    # pylint
    "PLE",      # errors
    "PLW",      # warnings
    "useless-return",
    # Ruff-specific rules
    "RUF",
]
ignore = [
    # pydocstyle
    "undocumented-magic-method",
    "undocumented-public-init",
    "incorrect-blank-line-before-class",
    "missing-blank-line-after-summary",
    "multi-line-summary-first-line",
    "non-imperative-mood",
    # Pyflakes
    "undefined-local-with-import-star",
    "unused-variable",
    # pycodestyle
    "whitespace-after-open-bracket",
    "whitespace-before-close-bracket",
    "whitespace-before-punctuation",
    "whitespace-before-parameters",
    "multiple-spaces-after-comma",
    "multiple-leading-hashes-for-block-comment",
    "module-import-not-at-top-of-file",
    "line-too-long",
    # pep8-naming
    "invalid-function-name",
    # pylint warnings
    "too-many-statements-in-try-clause",
    "bad-dunder-method-name",
    # flake8-pytest-style
    "pytest-extraneous-scope-function",
    "pytest-raises-too-broad",
    # flake8-pyi
    "redundant-numeric-union",
    # pyupgrade
    "redundant-open-modes",
    "f-string",
    # flake8-bugbear
    "unused-loop-control-variable",
    "assert-false",
    # flake8-simplify
    "collapsible-if",
    "if-else-block-instead-of-if-exp",
    "multiple-with-statements",
    # Ruff-specific rules
    "invalid-formatter-suppression-comment",
    "incorrectly-parenthesized-tuple-in-subscript",
    "non-empty-init-module",
]
unfixable = [
    "unnecessary-lambda",
]
task-tags = ["TODO", "FIXME", "XXX", "@@@"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"!tests/**" = ["PT"]
"tests/**" = [
    "D",  # pydocstyle
    "useless-expression",
]
# Temporary stuff that should be fixed up...
"**" = [
    "D",  # pydocstyle
    "eq-without-hash",
]
"src/minegauler/app/__main__.py" = [
    "global-statement",
]
"src/minegauler/app/frontend/__init__.py" = [
    "global-statement",
]
"src/minegauler/app/frontend/highscores.py" = [
    "function-call-in-default-argument",
]
"src/minegauler/app/frontend/state.py" = [
    "function-call-in-dataclass-default-argument",
]
"src/minegauler/bot/**" = ["PLW", "PYI"]

# mypy
# ------------------------
[tool.mypy]
check_untyped_defs = true

# importer-linter
# ------------------------
[tool.importlinter]
root_package = "minegauler"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "minegauler.bot",
    "minegauler.app.__main__",
    "minegauler.app.frontend",
    "minegauler.app.core",
    "minegauler.app.highscores",
    "minegauler.app.shared",
    "minegauler.app.paths",
    "minegauler.app._metadata",
]

# pytest
# ------------------------
[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src/"]
testpaths = ["tests/"]
xfail_strict = true
qt_api = "pyqt6"
filterwarnings = [
    "ignore:Creating a LegacyVersion:DeprecationWarning",
]
log_file = "test.log"
log_file_level = "debug"

# coverage
# ------------------------
[tool.coverage.run]
source = [
    "minegauler.app",
    "tests",
]
omit = [
    "*venv*/**",
]

[tool.coverage.report]
exclude_lines = [
    "assert False",
    "case _ as unreachable:",
    "raise NotImplementedError",
    "return NotImplemented",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]
precision = 1

[tool.coverage.html]
directory = "htmlcov"
